name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Loyihani yig'ish va kodni ulash
        run: |
          flutter create app
          mkdir -p app/assets
          if [ -f "bg.png" ]; then
            cp bg.png app/assets/bg.png
          else
            touch app/assets/bg.png
          fi
          cp main.dart app/lib/main.dart
          cat << 'EOF' > app/pubspec.yaml
          name: app
          description: NeoTarjima Vault
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter

          flutter:
            uses-material-design: true
            assets:
              - assets/bg.png
          EOF

      - name: Release APK yaratish
        working-directory: ./app
        run: flutter build apk --release

      - name: Tayyor APK faylni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: NeoTarjima-Tayyor-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
